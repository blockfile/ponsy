      - heading "Built for Real-World Assets" [level=2] [ref=f6e64]:
        - text: Built for Real-World Assets
        - link [ref=f6e65] [cursor=pointer]:
          - /url: /chain/#built-for-real-world-assets
      - paragraph [ref=f6e67]:
        - text: At its core, Robinhood Chain is optimized for
        - strong [ref=f6e68]: tokenized real-world assets (RWAs)
        - text: — including equities, ETFs, private assets, and other financial instruments — allowing them to be represented and traded onchain. This infrastructure supports Robinhood's vision of a financial ecosystem where assets can be
        - strong [ref=f6e69]: programmatically traded, self-custodied by users, and accessible 24/7
        - text: .
      - heading "Built on Proven Technology" [level=2] [ref=f6e70]:
        - text: Built on Proven Technology
        - link [ref=f6e71] [cursor=pointer]:
          - /url: /chain/#built-on-proven-technology
      - paragraph [ref=f6e73]: Robinhood Chain is built on Arbitrum Dedicated Blockchains, a modular Layer-2 framework that combines Ethereum's security with high throughput and low transaction costs. By operating as a Layer-2 solution, Robinhood Chain offloads transaction processing from Ethereum mainnet, aiming to achieve faster finality and cost efficiency. Robinhood Chain uses ETH as its native gas token.
      - heading "Predictable Transaction Ordering" [level=3] [ref=f6e74]:
        - text: Predictable Transaction Ordering
        - link [ref=f6e75] [cursor=pointer]:
          - /url: /chain/#predictable-transaction-ordering
      - paragraph [ref=f6e77]: Robinhood Chain utilizes a first-come, first-served sequencing model, where the order is determined strictly by the arrival time at the sequencer. The network ensures a transparent and predictable environment where no transaction can bypass others by paying higher fees.
      - heading "Open and Permissionless" [level=2] [ref=f6e78]:
        - text: Open and Permissionless
        - link [ref=f6e79] [cursor=pointer]:
          - /url: /chain/#open-and-permissionless
      - paragraph [ref=f6e81]:
        - text: Robinhood Chain is designed to be
        - strong [ref=f6e82]: permissionless and developer-friendly
        - text: . Anyone can interact with the network, build applications, and deploy smart contracts. This openness invites a diverse ecosystem of builders and users, expanding beyond a closed application into a fully accessible blockchain environment.
      - heading "EVM Compatible" [level=3] [ref=f6e83]:
        - text: EVM Compatible
        - link [ref=f6e84] [cursor=pointer]:
          - /url: /chain/#evm-compatible
      - paragraph [ref=f6e86]: Robinhood Chain is fully EVM-compatible. Smart contracts written in Solidity or Vyper deploy without modification, and all standard developer tooling works out of the box — including Hardhat, Foundry, ethers.js, viem, and Wagmi. Any wallet or dapp that supports standard JSON-RPC can connect directly.
      - heading "Account Abstraction" [level=3] [ref=f6e87]:
        - text: Account Abstraction
        - link [ref=f6e88] [cursor=pointer]:
          - /url: /chain/#account-abstraction
      - paragraph [ref=f6e90]: Robinhood Chain has first-class support for ERC-4337 account abstraction. Developers can submit and manage transactions, sponsor gas fees for users and create programmable wallets with built-in batching and session key support.
      - heading "Ecosystem" [level=2] [ref=f6e91]:
