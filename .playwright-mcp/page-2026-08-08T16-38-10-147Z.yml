        - text: About Robinhood Chain
        - link [ref=f6e36] [cursor=pointer]:
          - /url: /chain/#about-robinhood-chain
      - paragraph [ref=f6e38]:
        - strong [ref=f6e39]: Robinhood Chain
        - text: is a permissionless, Ethereum-compatible Layer-2 blockchain built to support a new era of onchain financial infrastructure — one that brings traditional markets, crypto, and real-world assets together on a fast, efficient, and open network.
      - paragraph [ref=f6e40]:
        - text: Robinhood Chain is part of
        - emphasis [ref=f6e41]: Robinhood's broader mission
        - text: to democratize access to global financial markets and to empower users and developers with modern blockchain tools. It is designed to enable the seamless transfer, access, and management of digital assets anywhere in the world, without intermediaries or platform lock-in.
      - heading "Start building" [level=2] [ref=f6e42]:
