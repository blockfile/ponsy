# nginx site for api.ponsy.fun -> the stats backend on 127.0.0.1:8787
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ponsy-api
#   sudo ln -sf /etc/nginx/sites-available/ponsy-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.ponsy.fun --redirect
#
# certbot rewrites this file in place to add the 443/TLS block and the http->https
# redirect. Do not hand-edit those parts afterwards; re-run certbot instead.
#
# NOTE: this is deliberately NOT a default_server. The box serves one hostname.
# A catch-all would answer for any name pointed at this IP, which is how a
# backend ends up quietly serving a domain it was never meant to.

server {
    listen 80;
    listen [::]:80;
    server_name api.ponsy.fun;

    # Requests that are not this host get dropped rather than proxied.
    if ($host != api.ponsy.fun) { return 444; }

    access_log /var/log/nginx/ponsy-api.access.log;
    error_log  /var/log/nginx/ponsy-api.error.log;

    # No uploads, no bodies. Anything large is not a real request for this API.
    client_max_body_size 8k;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The app bounds every upstream call at 8s and caches for 30s, so a
        # request that has taken 15s is already a failure — fail fast rather
        # than holding the connection open.
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;

        # The app sets its own Cache-Control (max-age=30). Let it through
        # untouched so any CDN in front honours the same window.
        proxy_pass_header Cache-Control;
    }
}
